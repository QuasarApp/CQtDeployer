name: CMake PR Builder
on:
  pull_request:
    types: [opened, synchronize, reopened] # Triggers only on pull request events

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The Linux ARM (aarch64) runner is the ARM64 build of the PR
        # testing (issue #918). The Qt 6.10.3 aarch64 packages are built
        # for Ubuntu 24.04, so the ARM leg uses ubuntu-24.04-arm.
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        build_type: [Release]
        c_compiler: [gcc]

    steps:
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux' && runner.arch == 'X64'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (Linux ARM)
      # The aarch64 host of the Qt repository (aqtinstall): the arch
      # string is linux_gcc_arm64 (issue #918).
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_arm64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (macOS)
      # The macOS Qt build is a universal binary (X86_64 + ARM64), so the
      # clang_64 package works on both the Intel and the Apple Silicon
      # runners (issue #166). No extra tools are installed: the Qt
      # Installer Framework binaries are stored in the repository
      # (src/CQtDeployer/Deploy/QIFW/binaries, issue #867).
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: ==3.2.*

    # Checkout main repository with submodules
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer
      # The install action downloads the *_Linux_aarch64.zip asset on the
      # Linux ARM (ARM64) runners (issue #918). The pinned version is the
      # first release with the full asset set of every platform, including
      # the Linux ARM (aarch64) packages (the "latest" stable release has
      # no ARM assets yet).
      uses: QuasarApp/cqtdeployer-install-action@main
      with:
        latest: true

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.type }}

    - name: Verify CQtDeployer version
      # Check if cqtdeployer is accessible and print its version
      run: cqtdeployer version

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: Run unit tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16 --target test

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore
