name: CMake PR Builder
on:
  pull_request:
    types: [opened, synchronize, reopened] # Triggers only on pull request events

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The Linux ARM (aarch64) runner is the ARM64 build of the PR
        # testing (issue #918). The Qt 6.10.3 aarch64 packages are built
        # for Ubuntu 24.04, so the ARM leg uses ubuntu-24.04-arm.
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        build_type: [Release]
        c_compiler: [gcc]

    steps:
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux' && runner.arch == 'X64'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (Linux ARM)
      # The aarch64 host of the Qt repository (aqtinstall): the arch
      # string is linux_gcc_arm64 (issue #918).
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_arm64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (macOS)
      # The macOS Qt build is a universal binary (X86_64 + ARM64), so the
      # clang_64 package works on both the Intel and the Apple Silicon
      # runners (issue #166). No extra tools are installed: the Qt
      # Installer Framework binaries are stored in the repository
      # (src/CQtDeployer/Deploy/QIFW/binaries, issue #867).
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: ==3.2.*

    # Checkout main repository with submodules
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer
      # On the Linux ARM runners the prebuilt release assets do not exist
      # yet (issue #918), so the install action is skipped there and the
      # bootstrap step below builds the tool from source instead.
      if: "!(runner.os == 'Linux' && runner.arch == 'ARM64')"
      uses: QuasarApp/cqtdeployer-install-action@main

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.type }}

    - name: Build CQtDeployer from source (Linux ARM, temporary)
      # Temporary bootstrap of issue #918: the ARM runner builds
      # cqtdeployer from source (a separate build tree, no tests) and
      # puts the freshly built executable on the PATH under the
      # "cqtdeployer" wrapper name of the CMake deploy and test targets.
      # The build-tree executable is directly runnable: the CMake build
      # rpath contains the build directories and the Qt library
      # directory. This step is removed once the first Linux ARM64
      # release exists (then the install action works on ARM like on
      # x86_64).
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      # Each line of the literal run block is a separate shell command,
      # the cmake configure arguments of the issue #918 bootstrap are
      # therefore kept on the single line.
      run: |
        cmake -B ${{ github.workspace }}/build-tool -G Ninja -DBUILD_SHARED_LIBS=ON -DCQT_DEPLOYER_TESTS=OFF -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}' -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -S ${{ github.workspace }}
        cmake --build ${{ github.workspace }}/build-tool --config ${{ matrix.build_type }} --parallel 16
        # The deploy and the test targets of the main tree run with the
        # bootstrap executable of the PATH, so the QIF and the AppImage
        # tools must be staged next to it (the cqtdeployer tool searches
        # <executable dir>/QIF and <executable dir>/AppImage, the
        # copyQIFW and the copyAppImage targets of the build-tool tree
        # stage them into build-tool/src/CQtDeployer). Without the
        # staging the QIFW and the AppImage distributions are silently
        # skipped by the cqtdeployer tool (issue #918).
        cmake --build ${{ github.workspace }}/build-tool --target copyQIFW
        cmake --build ${{ github.workspace }}/build-tool --target copyAppImage
        mkdir -p ${{ runner.temp }}/cqt
        ln -sf ${{ github.workspace }}/build-tool/src/CQtDeployer/CQtDeployer ${{ runner.temp }}/cqt/cqtdeployer
        echo "${{ runner.temp }}/cqt" >> "$GITHUB_PATH"

    - name: Verify CQtDeployer version
      # Check if cqtdeployer is accessible and print its version
      run: cqtdeployer version

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: Run unit tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16 --target test

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore
