name: CMake PR Builder
on:
  pull_request:
    types: [opened, synchronize, reopened] # Triggers only on pull request events

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-14]
        build_type: [Release]
        c_compiler: [gcc]

    steps:
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (macOS)
      # The macOS Qt build is a universal binary (X86_64 + ARM64), so the
      # clang_64 package works on both the Intel and the Apple Silicon
      # runners (issue #166). The Qt Installer Framework tools are not
      # available for macOS, therefore no extra tools are installed.
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: ==3.2.*

    # Checkout main repository with submodules
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer
      # The macOS job installs the release CQtDeployer package with this
      # action as well (issue #866). The release is pinned, because it is
      # the first one that ships the macOS (Darwin arm64) assets, so the
      # macOS job cannot rely on the latest stable release. The fork
      # reference includes the macOS case-insensitive directory collision
      # fix (commit 78602ce, QuasarApp/cqtdeployer-install-action PR #7)
      # which is not part of the upstream v1.2.1 tag. After the PR is
      # merged and tagged, switch the reference back to
      # QuasarApp/cqtdeployer-install-action@<tag>.
      uses: QuasarAppCI/cqtdeployer-install-action@task_866
      with:
        version: v1.6.2504.659185d

    - name: Align MinGW runtime libraries with the build toolchain (Windows)
      # The release zip bundles the MinGW runtime libraries (libstdc++-6,
      # libgcc_s_seh-1, libwinpthread-1) of the Qt kit that was used to
      # build it, while the deployed binaries link against libLIEF.dll
      # which is built with the newer toolchain GCC. When the stale
      # libstdc++-6.dll copy is loaded first, the release cqtdeployer
      # crashes with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) (issue
      # #861). Align the copies in the Qt kit bin directory and in the
      # cqt/ directory with the toolchain runtime, so the test target can
      # run the release cqtdeployer.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Pick the toolchain with the highest version number (the same
        # selection rule as QtDir::findMingwToolchainBin, issue #861).
        $toolchain = $null
        $best = -1
        foreach ($dir in Get-ChildItem (Join-Path $env:IQTA_TOOLS 'mingw*') -Directory) {
            if (-not (Test-Path (Join-Path $dir.FullName 'bin\libstdc++-6.dll'))) {
                continue
            }
            $digits = ($dir.Name -replace '^.*mingw', '' -replace '\D', '')
            $version = if ($digits) { [int]$digits } else { 0 }
            if ($version -gt $best) {
                $best = $version
                $toolchain = $dir.FullName
            }
        }
        if (-not $toolchain) {
            throw "The MinGW toolchain runtime was not found under $env:IQTA_TOOLS"
        }
        foreach ($lib in @('libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll')) {
            $src = Join-Path $toolchain.FullName "bin\$lib"
            foreach ($dst in @((Join-Path $env:QT_ROOT_DIR "bin\$lib"),
                               (Join-Path $env:GITHUB_WORKSPACE "cqt\$lib"))) {
                if (Test-Path $dst) {
                    Copy-Item -Path $src -Destination $dst -Force
                    Write-Host "Aligned $dst with $src"
                }
            }
        }


    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.type }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: Run unit tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16 --target test

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore