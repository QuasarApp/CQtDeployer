name: CMake PR Builder
on:
  pull_request:
    types: [opened, synchronize, reopened] # Triggers only on pull request events

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        build_type: [Release]
        c_compiler: [gcc]

    steps:
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: ==3.2.*

    # Checkout main repository with submodules
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer
      uses: QuasarApp/cqtdeployer-install-action@v1.1.0


    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.type }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=ON
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16


    - name: Align MinGW runtime libraries with the build toolchain (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # The Qt kit and the cqtdeployer release bundle ship their own
        # copies of the MinGW runtime libraries (libstdc++-6.dll,
        # libgcc_s_seh-1.dll, libwinpthread-1.dll). These copies are built
        # with an older GCC and do not export symbols like
        # _ZSt21ios_base_library_initv that are required by the DLLs that
        # are built with the mingw1310 toolchain. cqtdeployer matches
        # runtime libraries by name, and the scan environment is a salted
        # QHash, so parallel deployments may deploy a stale copy and the
        # deployed tests crash with STATUS_ENTRYPOINT_NOT_FOUND
        # (0xC0000139) (issues #861, #862). Replace every stale copy with
        # the toolchain libraries to make the deployment deterministic.
        TOOLCHAIN_BIN="$(ls -d "${IQTA_TOOLS}"/mingw*/bin 2>/dev/null | sort -V | tail -n 1)"
        if [ -z "${TOOLCHAIN_BIN}" ]; then
            echo "::error::MinGW toolchain bin directory not found under ${IQTA_TOOLS}"
            exit 1
        fi
        echo "Using toolchain: ${TOOLCHAIN_BIN}"
        for lib in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if [ -f "${TOOLCHAIN_BIN}/${lib}" ]; then
                if [ -f "${QT_ROOT_DIR}/bin/${lib}" ]; then
                    cp "${TOOLCHAIN_BIN}/${lib}" "${QT_ROOT_DIR}/bin/${lib}"
                    echo "Replaced ${QT_ROOT_DIR}/bin/${lib}"
                fi
            fi
        done

    - name: Run unit tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 1 --target test

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore