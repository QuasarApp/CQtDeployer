name: CMake Release Builder
on:
  push:
    tags:
      - 'v*' # This will trigger the workflow on any tag starting with 'v', like v1.0.0, v2.1, etc.
  workflow_dispatch:


jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      # The Linux ARM (aarch64) runner is the ARM64 build of the release
      # (issue #918). The Qt 6.10.3 aarch64 packages are built for Ubuntu
      # 24.04, so the ARM leg uses ubuntu-24.04-arm.
      matrix:
        os: [windows-2025, ubuntu-22.04, ubuntu-24.04-arm, macos-15]
        build_type: [Release]
        c_compiler: [gcc]


    steps:

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        # modules: 'qtquick3d qtquick3dphysics qtmultimedia qtquicktimeline qtshadertools'
        aqtversion: ==3.2.*

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux' && runner.arch == 'X64'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true

        # modules: 'qtquick3d qtquick3dphysics qtmultimedia  qtquicktimeline qtshadertools'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux ARM)
      # The aarch64 host of the Qt repository (aqtinstall): the arch
      # string is linux_gcc_arm64 (issue #918).
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_arm64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (macOS)
      # The macOS Qt build is a universal binary (X86_64 + ARM64), so the
      # clang_64 package works on both the Intel and the Apple Silicon
      # runners (issue #166). No extra tools are installed: the Qt
      # Installer Framework binaries are stored in the repository
      # (src/CQtDeployer/Deploy/QIFW/binaries, issue #867).
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: ==3.2.*

    - name: Setup LXD
      if: runner.os == 'Linux'
      uses: canonical/setup-lxd@main
      with:
        channel: latest/stable

    - name: Install Snapcraft
      if: runner.os == 'Linux'
      uses: samuelmeuli/action-snapcraft@v3

    # Checkout main repository without submodules first
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer
      # On the Linux ARM runners the prebuilt release assets do not exist
      # yet (issue #918), so the install action is skipped there and the
      # bootstrap step below builds the tool from source instead.
      if: !(runner.os == 'Linux' && runner.arch == 'ARM64')
      uses: QuasarApp/cqtdeployer-install-action@task_898
      with:
        version: v1.7.72.edd53600
        latest: false

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.type }}

    - name: Build CQtDeployer from source (Linux ARM, temporary)
      # Temporary bootstrap of issue #918: the ARM runner builds
      # cqtdeployer from source (a separate build tree, no tests) and
      # puts the freshly built executable on the PATH under the
      # "cqtdeployer" wrapper name of the CMake deploy target. The
      # build-tree executable is directly runnable: the CMake build
      # rpath contains the build directories and the Qt library
      # directory. This step is removed once the first Linux ARM64
      # release exists (then the install action works on ARM like on
      # x86_64).
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      run: |
        cmake -B ${{ github.workspace }}/build-tool
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=OFF
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        cmake --build ${{ github.workspace }}/build-tool --config ${{ matrix.build_type }} --parallel 16
        mkdir -p ${{ runner.temp }}/cqt
        ln -sf ${{ github.workspace }}/build-tool/src/CQtDeployer/CQtDeployer ${{ runner.temp }}/cqt/cqtdeployer
        echo "${{ runner.temp }}/cqt" >> "$GITHUB_PATH"

    - name: Configure CMake
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=OFF
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=OFF
        -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }};${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      # The cqtdeployer tool is installed by the cqtdeployer-install-action
      # step above, so the deploy targets are created at the configure time
      # as on the other platforms (issue #866).
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCQT_DEPLOYER_TESTS=OFF
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: deploy
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --target deploy --parallel 1

    - name: release
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --target release --parallel 1

    - name: Prepare the QIFW installer archives (macOS)
      # The binarycreator of the macOS hosts creates the Qt Installer
      # Framework installer of the multi-package self-deploy config
      # (the qifOut name, issue #884) as the .app bundle - a directory
      # with the ".app" suffix appended to the installer name (issue
      # 738). The release upload action needs a file, so the bundle is
      # packed into a zip archive (issue #884).
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd Distro
        zip -r -y "${INSTALLER_FULL_NAME}.app.zip" "${INSTALLER_FULL_NAME}.app"

    - name: Create Release and Upload Assets Installer
      if: runner.os != 'macOS'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.INSTALLER_FULL_NAME }}
        prerelease: true
        asset_name: ${{ env.INSTALLER_FULL_NAME }}
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets Installer (macOS)
      # The Qt Installer Framework installer of the macOS hosts is the
      # .app bundle of the binarycreator of the multi-package
      # self-deploy config, packed into a zip archive by the prepare
      # step (issue #884).
      if: runner.os == 'macOS'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.INSTALLER_FULL_NAME }}.app.zip
        prerelease: true
        asset_name: ${{ env.INSTALLER_FULL_NAME }}.app.zip
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets DMG (macOS)
      # The DMG package of the flat single self-deploy config (the
      # ready-to-use CQtDeployer application: the executable, the QIF
      # tools, the AppImage tools and the libraries), created by the
      # deploy command with the dmg option of the DMG backend of the
      # self-deploy config (the hdiutil tool of the macOS system, the
      # .dmg file of the Distro folder, the same way the deb/zip
      # artifacts are created, issue #899). The md/macOS.md page
      # documents the download of this CQtDeployer_*_dmg asset.
      if: runner.os == 'macOS'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.BASE_FULL_NAME }}.dmg
        prerelease: true
        asset_name: ${{ env.BASE_FULL_NAME }}.dmg
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets Deb
      if: runner.os == 'Linux'

      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.BASE_FULL_NAME }}.deb
        prerelease: true
        asset_name: ${{ env.BASE_FULL_NAME }}.deb
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets zip
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.BASE_FULL_NAME }}.zip
        prerelease: true
        asset_name: ${{ env.BASE_FULL_NAME }}.zip
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets AppImage
      # The appimage option of the flat self-deploy config
      # (CQtDeployerSingle.json) creates the AppImage package of the
      # CQtDeployer self package with the bundled appimagetool (issue
      # #898). The appimage option is available on the Linux host
      # platforms only, so the AppImage asset exists on the Linux
      # runners only.
      if: runner.os == 'Linux'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.BASE_FULL_NAME }}.AppImage
        prerelease: true
        asset_name: ${{ env.BASE_FULL_NAME }}.AppImage
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets Snap
      # The snapcraft of the x86_64 runners names the package
      # <name>_<version>_amd64.snap (issue #918).
      if: runner.os == 'Linux' && runner.arch == 'X64'

      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.SNAP_BASE_NAME }}_amd64.snap
        prerelease: true
        asset_name: ${{ env.BASE_FULL_NAME }}.snap
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

    - name: Create Release and Upload Assets Snap (ARM)
      # The snapcraft of the ARM runners names the package
      # <name>_<version>_arm64.snap (the arm64 architecture name of
      # snapd, issue #918).
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.CQT_DEPLOYER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.SNAP_BASE_NAME }}_arm64.snap
        prerelease: true
        asset_name: ${{ env.BASE_FULL_NAME }}.snap
        overwrite: true
        body: CQtDeployer ${{ env.CQT_DEPLOYER_VERSION }}

